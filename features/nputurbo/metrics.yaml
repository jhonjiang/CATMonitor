# nputurbo feature scope: the metrics the NPU slow-card upclock actuator needs.
#   npu.aicore_freq  -> current AICore frequency (input A for the boost formula)
#   nputurbo.*       -> actuator state metrics (observability)
# Scoping aicore_freq to High keeps it in snapshot_npu.json so the controller
# can read the per-card current frequency.
components:
  - component: npu
    interval: 3s
    metrics:
      - name: aicore_freq
        priority: High
  - component: nputurbo
    metrics:
      - name: boost_active
        priority: High
      - name: boost_count
        priority: High
      - name: actuator_ok
        priority: High
