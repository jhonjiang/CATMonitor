# CATMonitor Configuration File

server:
  # Server type: auto | cpu_only | accelerated
  # auto: detect GPU/NPU automatically
  type: auto

collectors:
  chassis:
    enabled: true
    interval: 3s
  cpu:
    enabled: true
    interval: 3s
  memory:
    enabled: true
    interval: 3s
  disk:
    enabled: true
    interval: 5s
  gpu:
    enabled: true
    interval: 3s
  npu:
    enabled: true
    interval: 3s
  network:
    enabled: true
    interval: 3s

storage:
  data_dir: /var/lib/catmonitor/data
  max_file_age: 168h
  rotation: daily

health:
  enabled: true
  weight_scheme: auto

collection:
  # Minimum priority to collect: low (all) | medium (skip Low) | high (only High)
  min_priority: medium

# Enabled features. For each name the daemon loads features/<name>/metrics.yaml
# (priority overrides — unions the metrics each feature needs so they survive
# metrics.Filter) and derives the per-component collection cadence C_comp as the
# min across the listed features' declared intervals (falling back to
# collectors.<name>.interval for components no feature declares). Empty = use the
# default catalog (configs/metrics.yaml) + collectors.interval only.
features: [web, dfee, health, cpugov, nputurbo]

# Fault subscription & push mechanism (features/faultsub). Default off; enable
# to let external fault managers (e.g. EEP) subscribe to NPU fault events via
# HTTP webhook and a REST API. See features/faultsub/faultsub_SPEC.md.
faultsub:
  enabled: false
  rest_addr: ":19321"           # subscription REST API listen address
  webhook_timeout: 5s          # per-request webhook push timeout
  webhook_retry: 1              # failed-webhook retry count
  event_buffer: 1024           # recent-event ring buffer (GET /faultsub/events)
  defaults:
    debounce_ms: 0             # default per-subscription debounce window
    min_severity: "warning"
  rules:                      # fault detection rule toggles (unset = enabled)
    card_drop: true
    npu_health: true
    npu_error_code: true
    hbm_uce: true
    ddr_uce: true
    roce_link_down: true
    driver_unhealthy: false

# Straggler-dedicated KPI file output (features/stragglerout). Default off;
# enable to let the slow-node detector consume CATMonitor's NPU KPI time-series
# instead of running its own kpi_collect.sh. See features/stragglerout/stragglerout_SPEC.md.
straggler_output:
  enabled: false
  data_dir: /var/lib/catmonitor/straggler   # KPI file directory
  retention: 360h            # file retention (default 15 days, matches baseline window)
  flush_interval: 60s        # in-memory buffer flush cadence

# Snapshot production (per-component snapshot_<comp>.json + global
# snapshot.json), consumed by read-only features (web/dfee). Default off — when
# off the daemon writes no snapshot files and behaves as before. When on, the
# daemon is the sole snapshot producer; web must run as a read-only consumer
# (no self-collection). See features/snapshot/.
snapshot:
  enabled: true
  dir: /var/lib/catmonitor/snapshot   # directory for snapshot_<comp>.json + snapshot.json

# CPU-senses-NPU energy saver (features/cpugov). Default off; actuation writes
# to sysfs (scaling_*_freq), requiring root + dry_run: false. Reads
# snapshot_cpu.json + snapshot_npu.json, so snapshot.enabled is a precondition.
# dry_run defaults true (judge+log only); set dry_run: false + run as root to
# actuate. See features/cpugov/cpugov_SPEC.md.
energysave:
  enabled: true
  interval: 3s
  cpu_idle_threshold_pct: 97
  observe_window: 120s
  non_idle_break: 2
  dry_run: true
  min_freq_override: 0
  npu_stale_sec: 6

# NPU slow-card upclock actuator (features/nputurbo). Default off; actuation
# execs /var/npu_turbo. Current freq is read from snapshot_npu.json's
# aicore_freq, so snapshot.enabled is a precondition. The daemon polls the
# straggler detector (exec straggler path=<result_path>) every interval to
# refresh the slow-card list. dry_run defaults true (judge+log only); set
# dry_run: false + run as root to actuate. See features/nputurbo/nputurbo_SPEC.md.
nputurbo:
  enabled: false
  interval: 60s
  straggler_cmd: "straggler path={path}"
  result_path: /var/lib/catmonitor/nputurbo/straggler_result.jsonl
  straggler_timeout: 60s
  npu_turbo_cmd: "/home/jw/npu_turbo_one.sh inject -n {id} -f {freq}"
  npu_turbo_clean_cmd: "/home/jw/npu_turbo_one.sh clean"
  npu_turbo_timeout: 10s
  max_freq_mhz: 1900
  step_mhz: 50
  dry_run: true
  restore_on_shutdown: true
